# Bygger container-imaget på GitHub, ikke på VPS-en.
#
# Hvorfor: Coolify bygger på SAMME maskin som den kjører appene på. Målt
# 30. august 2026 tok resonans-bygget der 16 minutter og 28 sekunder, og mens
# det pågikk svarte hverken Coolify, `hello` eller `toduvel` — tre apper som
# ikke har noe med resonans å gjøre. En maskin som betjener produksjon bør ikke
# også være byggeserver.
#
# Tregheten er dessuten ikke mangel på maskin: CPU-en lå på ~30 % gjennom hele
# bygget, fordi rollup-stegene er enkelttrådede. Elleve av de seksten minuttene
# gikk med til å transformere 1 444 moduler på én kjerne, og nesten tre til på å
# regne gzip-størrelser. Å kjøpe en større VPS ville ikke hjulpet.
#
# Dette bygget trenger INGEN hemmeligheter. All env-lesing i appen er runtime
# (`$env/dynamic/private`), så imaget er identisk uansett hvilke verdier som
# settes senere. Det er også grunnen til at flyttingen hit er billig.
name: Bygg container-image

on:
  push:
    branches: [main]
  # Manuell kjøring, så en feilet build kan prøves på nytt uten en tom commit.
  workflow_dispatch:

concurrency:
  # Merges kommer i klynger. Uten dette bygger tre commits samtidig, og den
  # eldste kan bli ferdig sist og overskrive `main`-taggen med gammel kode.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uten denne kan GITHUB_TOKEN lese pakker, men ikke pushe dem.
      packages: write

    # Hemmelighetene løftes til job-nivå fordi `secrets` IKKE er tilgjengelig i
    # en stegs `if`. Skriver man `if: secrets.X != ''`, er betingelsen alltid
    # usann og steget kjører aldri — uten at noe klager. `env` er tilgjengelig,
    # så deploy-steget under kan gate på seg selv.
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}

    steps:
      - uses: actions/checkout@v4

      - name: Logg inn på GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Bygg og push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Taggen er commit-SHA-en, og det er ikke pynt.
          #
          # Coolify puller ikke på nytt når taggen er uendret, så et deploy mot
          # «:latest» ser vellykket ut og kjører forrige image. Feilen er stum.
          # En SHA-tagg gjør dessuten rullback til å velge et image som ALT
          # finnes, framfor å bygge forrige commit på nytt — på den maskinen som
          # er nede.
          #
          # `:main` følger med som en lesbar peker på hva som er nyest.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          # amd64 alene. VPS-en er x86_64, og en multi-arch-build ville kjørt
          # arm64-delen under emulering — flere ganger byggetiden for et image
          # ingen bruker.
          platforms: linux/amd64
          # Actions-cachen gjør npm-stegene til treff når package-lock.json er
          # uendret, altså på de aller fleste commits.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ingen build-args, og det er et poeng: Dockerfilen setter selv
          # attrappene for de to variablene bygget krever
          # (`DATABASE_URL`, `OPENAI_API_KEY` — se kommentaren der).
          # Bygget oppfører seg dermed likt her, lokalt og i Coolify, og ingen
          # hemmelighet har en vei inn hit.

      - name: Oppsummer
        run: |
          echo "### Image bygget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Deployet skjer HER, etter at imaget er pushet — ikke av at Coolify ser en
      # git-push. Rekkefølgen er hele poenget: en deploy som starter på pushen
      # ville pekt på et image som ikke finnes ennå.
      #
      # Steget hopper over seg selv til hemmelighetene finnes, så workflowen kan
      # merges før VPS-en er satt opp uten å feile på hver kjøring. Når
      # COOLIFY_URL og COOLIFY_TOKEN er lagt inn under Settings → Secrets →
      # Actions, begynner det å virke av seg selv.
      #
      # NB: Coolify må ha registry-legitimasjon for å pulle et PRIVAT
      # ghcr.io-image, og appen må stå på build pack «dockerimage». Begge deler
      # settes av `coolify-apply.mjs` i resonans-lab, med `--image-tag`.
      - name: Deploy til Coolify
        if: ${{ env.COOLIFY_URL != '' && env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          SHA="${{ github.sha }}"

          # ── En glipp i nettverket er ikke en deployfeil, men kostet like ─────
          # mye. 3. september 2026 hang PATCH-kallet under i FEM minutter og
          # døde på «curl: (28) SSL connection timeout». Steget hadde hverken
          # tidsgrense eller nytt forsøk, så en Coolify som var borte et
          # øyeblikk kostet hele deployet — og prod sto igjen på forrige image
          # med et rødt kryss som eneste spor.
          #
          # Taket er 30 s per forsøk. Coolify svarer normalt på under ett
          # sekund, så alt over det er en maskin som ikke er der, og ventingen
          # kjøper ingenting. Verste tilfelle er nå ~100 s mot fem minutter.
          #
          # `--retry` dekker nettopp timeout (curl regner den som forbigående),
          # og NB: den gjelder også 5xx. På `POST /deploy` betyr det at et
          # svar som gikk tapt underveis kan starte deploy nummer to — det er
          # ufarlig her, siden begge peker på SAMME tagg og altså samme image;
          # utfallet er en rullende oppdatering til det man alt ba om.
          # `--retry-all-errors` er bevisst IKKE med: den ville også gjentatt
          # feil som ikke er forbigående.
          coolify() {
            local metode=$1 sti=$2 kropp=${3:-}
            local -a args=(
              -sS -o /tmp/coolify-svar.json -w '%{http_code}'
              --connect-timeout 10 --max-time 30
              --retry 2 --retry-delay 5 --retry-connrefused
              -X "$metode"
              -H "authorization: Bearer $COOLIFY_TOKEN"
              -H "accept: application/json"
            )
            if [ -n "$kropp" ]; then
              args+=( -H "content-type: application/json" -d "$kropp" )
            fi
            curl "${args[@]}" "$COOLIFY_URL$sti"
          }

          # Sier hva som IKKE skjedde, og hvordan man kommer videre. Uten de to
          # setningene måtte den som leser en rød kjøring selv finne ut at
          # imaget alt ligger i registeret og at bare dette steget gjenstår.
          uten_kontakt() {
            echo "::error::Nådde ikke Coolify. Imaget er bygget og pushet, men taggen ble IKKE flyttet — prod kjører fortsatt forrige image."
            echo 'Ingen halvveis tilstand: taggen flyttes før deployet bes om, så et'
            echo 'kall som ikke nådde fram har ikke endret noe.'
            echo 'Kjør workflowen på nytt når Coolify svarer (Actions → Bygg'
            echo 'container-image → Run workflow). Imaget finnes alt, så bygget blir'
            echo 'cache-treff og dette steget er i praksis det eneste som gjentas:'
            echo "  ghcr.io/${{ github.repository }}:$SHA"
          }

          # ── Flytt taggen FØRST. Uten dette steget er hele deployet et ────────
          # skuespill, og det er ikke en hypotese: 31. august 2026 bygget
          # workflowen `:afac9be`, ba Coolify deploye, fikk en gyldig
          # deployment_uuid tilbake og rapporterte grønt — mens Coolify-loggen
          # sa «Starting deployment of …:fa061fa», altså imaget fra to merger
          # tidligere. Appen sto pinnet til den taggen `coolify-apply.mjs` en
          # gang satte, og INGENTING flyttet den.
          #
          # `POST /deploy` sier bare «kjør det du står på». Taggen bor i
          # Coolify-appens konfigurasjon, så den må settes eksplisitt.
          #
          # Dette er grunnen til at tokenet trenger «write» i tillegg til
          # «deploy». Minste privilegium tilsier ellers deploy alene — men et
          # token som ikke kan flytte taggen gir et deploy som ser vellykket ut
          # og kjører gammel kode, og det er en dårligere handel.
          echo "Setter image-tag til $SHA …"
          if ! kode=$(coolify PATCH "/api/v1/applications/$COOLIFY_APP_UUID" "{\"docker_registry_image_tag\":\"$SHA\"}"); then
            uten_kontakt
            exit 1
          fi
          cat /tmp/coolify-svar.json; echo
          case "$kode" in
            200|201|204) echo "Tag satt." ;;
            403)
              echo "::error::COOLIFY_TOKEN mangler «write» (HTTP 403)."
              echo 'Tokenet må ha BÅDE «write» og «deploy». Med bare «deploy» kan'
              echo 'workflowen starte et deploy, men ikke flytte taggen — og da'
              echo 'kjører Coolify forrige image mens alt rapporterer grønt.'
              exit 1 ;;
            *)
              echo "::error::Klarte ikke å sette image-tag (HTTP $kode). Svar over."
              exit 1 ;;
          esac

          echo "Deployer $SHA til Coolify …"
          if ! coolify POST "/api/v1/deploy?uuid=$COOLIFY_APP_UUID" >/dev/null; then
            # Taggen ER flyttet nå, så neste kjøring — eller et manuelt deploy i
            # Coolify — plukker opp riktig image. Det er verdt å si, ellers ser
            # dette ut som samme tilstand som feilen over.
            echo '::error::Taggen er satt, men deploy-kallet nådde ikke Coolify.'
            echo 'Prod kjører fortsatt forrige image. Et deploy fra Coolify-UI-et'
            echo 'vil nå plukke opp riktig tagg, siden PATCH-en gikk gjennom.'
            exit 1
          fi
          svar=$(cat /tmp/coolify-svar.json)
          echo "$svar"
          # Coolify svarer 200 med en feilmelding i kroppen på flere feil, så en
          # exit-kode alene er ikke nok til å si at deployet startet.
          echo "$svar" | grep -q deployment_uuid || {
            echo "::error::Coolify startet ikke et deploy. Svar over."
            exit 1
          }
      - name: Si fra at deployet ikke er koblet opp ennå
        if: ${{ env.COOLIFY_URL == '' || env.COOLIFY_TOKEN == '' || env.COOLIFY_APP_UUID == '' }}
        run: |
          {
            echo "### Deploy hoppet over"
            echo
            echo "Imaget er bygget og pushet, men ikke deployet: Coolify-koblingen"
            echo "mangler. Legg inn under Settings →"
            echo
            echo "- **Secrets → Actions**: \`COOLIFY_URL\`, \`COOLIFY_TOKEN\` (write + deploy)"
            echo "- **Variables → Actions**: \`COOLIFY_APP_UUID\`"
            echo
            echo "Og på VPS-en: registry-legitimasjon for ghcr.io, siden imaget er privat."
          } >> "$GITHUB_STEP_SUMMARY"
